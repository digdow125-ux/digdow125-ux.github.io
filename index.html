<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RIANDERBLOG — your gateway to global shopping.">
  <title>RIANDERBLOG — Global Marketplace</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071a33;color:#fff;font-family:Arial,sans-serif;text-align:center}
    main{max-width:620px;padding:32px}
    h1{letter-spacing:2px;color:#e2b84b}
    p{line-height:1.7;color:#d7dfeb}
    a{display:inline-block;margin-top:16px;padding:14px 24px;border-radius:8px;background:#e2b84b;color:#071a33;text-decoration:none;font-weight:bold}
  </style>
</head>
<body>
  <main>
    <h1>RIANDERBLOG</h1>
    <p>Your gateway to global shopping.</p>
    <a href="https://digdow125-ux.github.io/Rianderblog/">Visit the Marketplace</a>
  </main>
  <script>
    // Record visits to the root RIANDERBLOG domain in the same analytics
    // system used by the marketplace. This key is a public Supabase publishable key.
    (async function trackRootWebsiteVisit() {
      try {
        const response = await fetch('https://yymdyxlbdgbrgrykdspx.supabase.co/functions/v1/visitor-track', {
          method: 'POST',
          headers: {
            'apikey': 'sb_publishable_S13gp2eIUUUiT3AP21YQKw_jt4U_wUn',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            page_path: (location.pathname || '/').slice(0, 200),
            referrer_host: document.referrer ? new URL(document.referrer).hostname.slice(0, 255) : null
          })
        });
        if (!response.ok) console.warn('RIANDERBLOG root visitor tracking returned:', response.status);
      } catch (error) {
        console.warn('RIANDERBLOG root visitor tracking unavailable:', error);
      }
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js')
          .catch(function (error) { console.error('Service worker registration failed:', error); });
      });
    }
  </script>
</body>
</html>
